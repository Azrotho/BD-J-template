name: distrib.yml
on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
        - name: Checkout repository
          uses: actions/checkout@v7

        - name: Setup JDK 8
          uses: actions/setup-java@v6
          with:
            distribution: 'temurin'
            java-version: '17'

        - name: Make gradlew executable
          run: chmod +x gradlew

        - name: Setup Gradle
          uses: gradle/actions/setup-gradle@v6

        - name: Build ISO with Gradle
          run: ./gradlew buildISO