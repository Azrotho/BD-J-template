name: distrib.yml
on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
        - name: Checkout repository
          uses: actions/checkout@v7

        - name: Setup JDK 8 and 17
          uses: actions/setup-java@v6
          with:
            distribution: 'temurin'
            java-version: |
              8
              17

        - name: Install deps
          run: sudo apt-get update -y && sudo apt upgrade -y && sudo apt-get install -y libbsd-dev pkg-config

        - name: Make gradlew executable
          run: chmod +x gradlew

        - name: Setup Gradle
          uses: gradle/actions/setup-gradle@v6

        - name: Build ISO with Gradle
          run: ./gradlew buildISO

        - name: Upload ISO artifact
          uses: actions/upload-artifact@v7
          with:
            name: bdj-template-iso
            path: build/*.iso
            retention-days: 7